[package]
name = "caplab"
version = "0.1.0"
edition = "2021"
description = "DB capacity lab: register schema, queries and frequencies; estimate and run load tests (MySQL / PostgreSQL)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
futures = "0.3"
hdrhistogram = "7"
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
opt-level = 3
